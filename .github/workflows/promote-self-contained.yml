name: Diagnose self-contained bootstrap

on:
  push:
    branches:
      - release/self-contained-pages-20260820
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/self-contained-pages-20260820
          fetch-depth: 0
      - name: Decode bootstrap patches
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, glob, re

          def clean_text(path):
              raw = Path(path).read_text()
              return re.sub(r'[^A-Za-z0-9+/=]', '', raw)

          def decode_segments(pattern, output):
              pieces = []
              for path in sorted(glob.glob(pattern)):
                  clean = clean_text(path)
                  clean += '=' * (-len(clean) % 4)
                  data = base64.b64decode(clean, validate=False)
                  pieces.append(data)
                  print(path, 'clean', len(clean), 'decoded', len(data))
              Path(output).write_bytes(b''.join(pieces))
              print(output, 'total', sum(map(len, pieces)))

          decode_segments('.bootstrap/source.patch.gz.b64.*', '/tmp/source.patch.gz')
          decode_segments('.bootstrap/patch/*.b64', '/tmp/extra.patch.gz')
          PY
          gzip -t /tmp/source.patch.gz
          gzip -dc /tmp/source.patch.gz > /tmp/source.patch
          echo '=== source patch ==='
          wc -c /tmp/source.patch.gz /tmp/source.patch
          head -20 /tmp/source.patch
          git apply --stat /tmp/source.patch || true
          gzip -t /tmp/extra.patch.gz
          gzip -dc /tmp/extra.patch.gz > /tmp/extra.patch
          echo '=== extra patch ==='
          wc -c /tmp/extra.patch.gz /tmp/extra.patch
          head -20 /tmp/extra.patch
          git apply --stat /tmp/extra.patch || true
      - name: Upload decoded patches
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: decoded-bootstrap-patches
          path: |
            /tmp/source.patch
            /tmp/extra.patch
          retention-days: 1
