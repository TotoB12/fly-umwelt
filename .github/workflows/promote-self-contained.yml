name: Diagnose self-contained bootstrap

on:
  push:
    branches:
      - release/self-contained-pages-20260820
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/self-contained-pages-20260820
          fetch-depth: 0
      - name: Decode bootstrap patches
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/source.patch.gz.b64.* | base64 --decode --ignore-garbage > /tmp/source.patch.gz
          gzip -t /tmp/source.patch.gz
          gzip -dc /tmp/source.patch.gz > /tmp/source.patch
          echo '=== source patch ==='
          wc -c /tmp/source.patch.gz /tmp/source.patch
          head -20 /tmp/source.patch
          git apply --stat /tmp/source.patch || true
          cat .bootstrap/patch/*.b64 | base64 --decode --ignore-garbage > /tmp/extra.patch.gz
          gzip -t /tmp/extra.patch.gz
          gzip -dc /tmp/extra.patch.gz > /tmp/extra.patch
          echo '=== extra patch ==='
          wc -c /tmp/extra.patch.gz /tmp/extra.patch
          head -20 /tmp/extra.patch
          git apply --stat /tmp/extra.patch || true
      - name: Upload decoded patches
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: decoded-bootstrap-patches
          path: |
            /tmp/source.patch
            /tmp/extra.patch
          retention-days: 1
