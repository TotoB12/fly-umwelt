name: Materialize validated Fly Umwelt 3.3 on main

on:
  push:
    branches:
      - main
    paths:
      - .bootstrap/canonical-tail/GO
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fly-umwelt-canonical-main-materialization
  cancel-in-progress: true

env:
  EXPECTED_PARENT: b032e1625e7a60594cb9972ad31257d1285dd8b4
  PATCH_SHA256: 1d2e90fd8331d091b2efeffb952470f80a4256b80c88f258bcf7c2bbdf8d8e98
  EXPECTED_PATCH_BYTES: '580875'

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out the exact main trigger
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reconstruct and verify the canonical source patch
        shell: bash
        run: |
          set -euo pipefail
          {
            for file in \
              .bootstrap/patch/part-00.b64 \
              .bootstrap/patch/part-01-02.b64 \
              .bootstrap/patch/part-03-04.b64 \
              .bootstrap/patch/part-05-06.b64 \
              .bootstrap/patch/part-07-08.b64 \
              .bootstrap/patch/part-09-10.b64 \
              .bootstrap/patch/part-11-12.b64 \
              .bootstrap/patch/part-13-14.b64 \
              .bootstrap/patch/part-15-16.b64 \
              .bootstrap/patch/part-17-18.b64 \
              .bootstrap/patch/part-19-20.b64 \
              .bootstrap/patch/part-21.b64 \
              .bootstrap/patch/part-22.b64 \
              .bootstrap/patch/part-23.b64 \
              .bootstrap/patch/part-24.b64 \
              .bootstrap/patch/part-25-26.b64 \
              .bootstrap/patch/part-27-28.b64
            do
              test -s "$file"
              tr -cd 'A-Za-z0-9+/=' < "$file"
            done
          } | base64 --decode | gzip --decompress > /tmp/fly-umwelt-main.patch

          echo "$PATCH_SHA256  /tmp/fly-umwelt-main.patch" | sha256sum --check --strict
          test "$(wc -c < /tmp/fly-umwelt-main.patch)" -eq "$EXPECTED_PATCH_BYTES"
          git apply --stat /tmp/fly-umwelt-main.patch

      - name: Build a clean source tree from the original public parent
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$EXPECTED_PARENT^{commit}"
          rm -rf /tmp/fly-umwelt-canonical
          git worktree add --detach /tmp/fly-umwelt-canonical "$EXPECTED_PARENT"
          cd /tmp/fly-umwelt-canonical
          git apply --check /tmp/fly-umwelt-main.patch
          git apply /tmp/fly-umwelt-main.patch

          test "$(node -p "require('./package.json').version")" = "3.3.0"
          test -f scripts/build_banc_pack.py
          test -f scripts/build_wasm.mjs
          test -f scripts/validate_banc_pack.mjs

      - name: Install the permanent repository validation workflow
        shell: bash
        working-directory: /tmp/fly-umwelt-canonical
        run: |
          set -euo pipefail
          mkdir -p .github/workflows
          cat > .github/workflows/validate.yml <<'VALIDATE'
          name: Validate Fly Umwelt

          on:
            push:
              branches: [main]
            pull_request:
              branches: [main]
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            validate:
              runs-on: ubuntu-latest
              timeout-minutes: 30
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 20
                    cache: npm
                - name: Install
                  run: npm ci
                - name: Static and scientific checks
                  run: |
                    npm run check
                    npm run check:banc
                - name: Deterministic tests
                  run: npm test
                - name: Build Cloudflare Pages output
                  run: npm run build
                - name: Audit static deployment
                  shell: bash
                  run: |
                    python3 - <<'PY'
                    from pathlib import Path
                    limit = 25 * 1024 * 1024
                    files = [p for p in Path('dist').rglob('*') if p.is_file()]
                    assert files, 'dist is empty'
                    oversized = [(str(p), p.stat().st_size) for p in files if p.stat().st_size >= limit]
                    assert not oversized, oversized
                    required = [
                        Path('dist/data/banc/manifest.json'),
                        Path('dist/wasm/lif-kernel.wasm'),
                    ]
                    missing = [str(p) for p in required if not p.is_file()]
                    assert not missing, missing
                    print(f'{len(files)} files; largest={max(p.stat().st_size for p in files)} bytes')
                    PY
          VALIDATE

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: /tmp/fly-umwelt-canonical/package-lock.json

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deterministic build dependencies
        shell: bash
        working-directory: /tmp/fly-umwelt-canonical
        run: |
          set -euo pipefail
          npm ci
          python -m pip install --disable-pip-version-check numpy pyarrow

      - name: Materialize all browser-local scientific assets
        shell: bash
        working-directory: /tmp/fly-umwelt-canonical
        run: |
          set -euo pipefail
          npm run fixture
          npm run wasm:build
          npm run data:banc:strict

      - name: Run the complete deterministic release gate
        shell: bash
        working-directory: /tmp/fly-umwelt-canonical
        run: |
          set -euo pipefail
          npm run check
          npm run check:banc
          npm test
          npm run build

      - name: Audit the exact Cloudflare Pages output
        shell: bash
        working-directory: /tmp/fly-umwelt-canonical
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          limit = 25 * 1024 * 1024
          files = [p for p in Path('dist').rglob('*') if p.is_file()]
          assert files, 'dist is empty'
          oversized = [(str(p), p.stat().st_size) for p in files if p.stat().st_size >= limit]
          assert not oversized, oversized

          required_source = [
              Path('public/data/banc/manifest.json'),
              Path('public/wasm/lif-kernel.wasm'),
              Path('.github/workflows/validate.yml'),
          ]
          required_dist = [
              Path('dist/data/banc/manifest.json'),
              Path('dist/wasm/lif-kernel.wasm'),
          ]
          missing = [str(p) for p in required_source + required_dist if not p.is_file()]
          assert not missing, missing

          for manifest in Path('dist').rglob('manifest.json'):
              text = manifest.read_text(errors='ignore')
              assert 'http://' not in text and 'https://' not in text, manifest

          banc = json.loads(Path('public/data/banc/manifest.json').read_text())
          assert (banc.get('neuronCount') or banc.get('neuron_count')) == 155855
          print(json.dumps({
              'deployment_files': len(files),
              'deployment_bytes': sum(p.stat().st_size for p in files),
              'largest_asset_bytes': max(p.stat().st_size for p in files),
              'banc_neurons': banc.get('neuronCount') or banc.get('neuron_count'),
              'package_version': json.loads(Path('package.json').read_text())['version'],
          }, indent=2))
          PY

      - name: Create one clean canonical commit and replace main
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/fly-umwelt-canonical

          rm -rf dist node_modules .cache .bootstrap
          rm -f PROMOTION_FAILURE.md
          rm -f .github/workflows/install-canonical-main.yml
          rm -f .github/workflows/materialize-main.yml
          rm -f .github/workflows/promote-canonical-main-final.yml
          rm -f .github/workflows/cleanup-temporary-repository-state.yml
          rm -f .github/workflows/promote-self-contained.yml

          git config user.name 'Fly Umwelt repository automation'
          git config user.email 'noreply@github.com'
          git add -A
          git diff --cached --check

          TREE=$(git write-tree)
          NEW_COMMIT=$(printf '%s\n' 'Promote validated self-contained Fly Umwelt 3.3.0' | git commit-tree "$TREE" -p "$EXPECTED_PARENT")
          test "$(git rev-parse "$NEW_COMMIT^")" = "$EXPECTED_PARENT"

          git push origin "$NEW_COMMIT:refs/heads/main" \
            --force-with-lease="refs/heads/main:$GITHUB_SHA"

          echo "Promoted canonical commit $NEW_COMMIT to main."
