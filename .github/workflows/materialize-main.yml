name: Materialize self-contained main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.event_name == 'push' && github.event.head_commit.message == 'Install self-contained source materializer'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out the exact bootstrap commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Verify and decode the canonical source patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .bootstrap/patch -maxdepth 1 -type f -name 'part-*.b64' | wc -l)" -eq 17
          LC_ALL=C find .bootstrap/patch -maxdepth 1 -type f -name 'part-*.b64' -print0 \
            | sort -z \
            | xargs -0 cat > /tmp/source.patch.gz.b64
          echo "f1afd3bd13a4719342c95ec806eb793b1b1bb90dbc29c44e6f002402c4bb7625  /tmp/source.patch.gz.b64" | sha256sum -c -
          base64 --decode /tmp/source.patch.gz.b64 > /tmp/source.patch.gz
          gzip --decompress --stdout /tmp/source.patch.gz > /tmp/source.patch
          echo "1d2e90fd8331d091b2efeffb952470f80a4256b80c88f258bcf7c2bbdf8d8e98  /tmp/source.patch" | sha256sum -c -
          git apply --check /tmp/source.patch

      - name: Rebuild the clean source tree
        shell: bash
        run: |
          set -euo pipefail
          BOOTSTRAP_BASE=3ea096692406bbff4866da8daf03aa33b8ef1737
          git reset --hard "$BOOTSTRAP_BASE"
          git apply /tmp/source.patch
          rm -rf .bootstrap .github/workflows/materialize-main.yml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build-time data dependencies
        run: python -m pip install --upgrade pip pyarrow numpy

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build deterministic fixture and neural WebAssembly kernel
        run: |
          npm run fixture
          npm run wasm:build

      - name: Build the pinned BANC whole-CNS pack
        run: npm run data:banc:strict

      - name: Vendor pinned browser physics and musculoskeletal assets
        run: npm run data:vendors

      - name: Regenerate source manifest
        run: npm run release:manifest

      - name: Validate source, connectome, deterministic behavior and static build
        run: |
          npm run check
          npm run check:banc
          npm test
          npm run build

      - name: Enforce self-contained Cloudflare Pages constraints
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          limit = 25 * 1024 * 1024
          required_source = [
              Path('public/data/banc/manifest.json'),
              Path('public/wasm/lif-kernel.wasm'),
              Path('public/vendor/neuromechfly/vendor/mujoco/mujoco.wasm'),
              Path('public/vendor/neuromechfly/model/fly.xml'),
              Path('public/vendor/flymimic/model.xml'),
              Path('.github/workflows/validate.yml'),
          ]
          missing = [str(p) for p in required_source if not p.is_file()]
          assert not missing, missing
          files = [p for p in Path('dist').rglob('*') if p.is_file()]
          assert files, 'dist is empty'
          too_large = [(str(p), p.stat().st_size) for p in files if p.stat().st_size >= limit]
          assert not too_large, too_large
          required_dist = [
              Path('dist/data/banc/manifest.json'),
              Path('dist/wasm/lif-kernel.wasm'),
              Path('dist/vendor/neuromechfly/vendor/mujoco/mujoco.wasm'),
              Path('dist/vendor/neuromechfly/model/fly.xml'),
              Path('dist/vendor/flymimic/model.xml'),
          ]
          missing_dist = [str(p) for p in required_dist if not p.is_file()]
          assert not missing_dist, missing_dist
          manifests = list(Path('dist').rglob('manifest.json'))
          for manifest in manifests:
              text = manifest.read_text(errors='ignore')
              assert 'mode":"cors"' not in text and "mode:'cors'" not in text, manifest
          print(f'{len(files)} deployment files; every asset is below 25 MiB')
          PY

      - name: Commit the clean canonical source directly to main
        shell: bash
        env:
          BOOTSTRAP_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          rm -rf dist node_modules .cache .venv __pycache__
          git config user.name 'Fly Umwelt repository automation'
          git config user.email 'noreply@github.com'
          git add -A
          git commit -m 'Upgrade main to self-contained whole-CNS browser source'
          git push --force-with-lease=refs/heads/main:${BOOTSTRAP_HEAD} origin HEAD:main
